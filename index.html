<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Манхва — Глава 1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#000;color:#fff}body{font-family:system-ui,sans-serif}.reader{width:100%;max-width:800px;margin:0 auto;font-size:0;line-height:0}.reader img{display:block;width:100%;height:auto;margin:0;padding:0;border:0;vertical-align:bottom}.error{font-size:15px;line-height:1.5;color:#ddd;padding:20px;text-align:center}
</style>
</head>
<body>
<main class="reader" id="reader" aria-label="Манхва, глава 1"></main>
<script>
// Точные имена файлов: 1.jpg, затем 2.png–14.png.
const reader = document.getElementById('reader');
const files = ['1.jpg', ...Array.from({length:13}, (_,i) => `${i+2}.png`)];
files.forEach((file, i) => {
  const img = document.createElement('img');
  img.alt = `Глава 1 — часть ${i+1}`;
  img.decoding = 'async';
  if (i > 1) img.loading = 'lazy';
  img.src = `images/${file}`;
  img.onerror = () => {
    const note = document.createElement('div');
    note.className = 'error';
    note.textContent = `Не удалось загрузить ${file}. Проверь имя файла в папке images.`;
    img.replaceWith(note);
  };
  reader.append(img);
});
</script>
</body>
</html>
